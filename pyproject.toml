[tool.poetry]
name = "planet-tracker"
version = "3.0.0"
description = "Server for Planet Tracker web app"
authors = ["Dean Shaff <dean.shaff@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"
ephem = "4.1.6"
gunicorn = "23.0.0"
litestar = { extras = ["standard"], version = "2.12.1" }
geocoder = "1.38.1"
granian = "1.6.3"
multidict = "6.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
anyio = "^4.1.0"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
